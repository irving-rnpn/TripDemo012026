<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorías</title>
    <link rel="stylesheet" th:href="@{/bootstrap/css/bootstrap.min.css}" />
</head>
<body>
    <header th:insert="fragments/menu :: menu-principal"></header>
    <main role="main">
        <hr>
    <div class="container mt-4">
        <div class="card">
            <div class="card-body">
                <a class="btn btn-primary" th:href="@{/categorias/create}" role="button">
                    <i class="fas fa-file" aria-hidden="true"></i> Nueva
                </a>
                <hr>
                <div th:if="${msg != null}" class="alert alert-success" th:text="${msg}" role="alert"></div>
                <table class="table table-hover">
                    <thead class="thead-light">
                        <tr>
                            <th scope="col">Id</th>
                            <th scope="col">Nombre</th>
                            <th scope="col">Descripción</th>
                            <th scope="col">Operaciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="cat : ${categorias}">
                            <th scope="row" th:text="${cat.id}"></th>
                            <td th:text="${cat.nombre}"></td>
                            <td th:text="${cat.descripcion}"></td>
                            <td>
                                <a th:href="@{'/categorias/edit/' + ${cat.id}}" class="btn btn-success btn-sm" role="button" title="Editar">
                                    <i class="fas fa-pencil-alt" aria-hidden="true"></i>
                                </a>
                                <a th:href="@{'/categorias/delete/' + ${cat.id}}" onclick="return confirm('¿Estas seguro?')" class="btn btn-danger btn-sm" role="button" title="Eliminar">
                                    <i class="fas fa-trash" aria-hidden="true"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    </main>

    <footer th:insert="fragments/footer :: pie-pagina"></footer>

    <script th:src="@{/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script src="https://kit.fontawesome.com/4e8b1e6e6b.js" crossorigin="anonymous"></script>
</body>
</html>
